[project]
name = "jarvis"
version = "0.1.0"
description = "A voice-first assistant that drives Claude Code"
requires-python = ">=3.11"
# tzdata on Windows only: CPython there ships no zone database, so
# ZoneInfo("Europe/Istanbul") raises and the scheduler cannot compute 10:00.
# zoneinfo loads it lazily as data, so the spine still imports under `python -S`.
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
# The Claude Code driver. Pinned: about a third of the payload specifics this
# project relies on are undocumented internals of one CLI build, and a voice
# daemon auto-updating its bundled CLI is exactly the failure mode.
cc = ["claude-agent-sdk>=0.2.153,<0.3"]
# The desk audio graph. Every one of these is optional at import time: the graph
# runs end to end on synthetic audio with passthrough DSP and no device at all,
# which is what makes it testable in CI and on a box with no sound card.
#   pywebrtc-audio is WebRTC AEC3 (the algorithm in Chrome) with wheels for
#   cp310-cp314 across manylinux/musllinux/macOS/Windows, and it releases the GIL
#   so it can run inside the PortAudio callback. The three obvious alternatives
#   are dead: pyaudio-webrtc-apm does not exist on PyPI, speexdsp last shipped in
#   2018, webrtc-audio-processing ships armv7l wheels only.
voice = ["numpy>=2", "sounddevice>=0.5.6", "soxr>=1.1"]
aec = ["pywebrtc-audio>=0.2"]
# The Gemini Live session. gemini-3.8-live is the current model; the build
# sheet's gemini-3.1-flash-live-preview is legacy. The SDK README warns to pin
# below 3.0.0.
live = ["google-genai>=2.23,<3"]
# Microsoft's neural voices (the British "Ryan" reader), over the network. Edge
# sends MP3; miniaudio decodes it in-process, because Windows has no ffmpeg and
# without a decoder that voice can never play there.
tts = ["edge-tts>=7", "miniaudio>=1.59"]
# The OS keyring. Optional at import time and imported INSIDE the functions that
# use it (jarvis/secrets.py), because every process opens that module and the
# spine has to keep importing under `python -S`. Without it, credentials come
# from the environment and `doctor` says so.
secrets = ["keyring>=25"]
# MaxMind's official reader for the local GeoLite2 City database. Optional: the
# weather for a NAMED place works without it, and so does a location set in
# config.toml. Apache-2.0.
geo = ["maxminddb>=2.6"]
# The wake word. openWakeWord's MODELS run on onnxruntime directly; the
# openwakeword PACKAGE is deliberately not a dependency (it imports scipy and
# scikit-learn, and on Linux requires tflite-runtime, which has no wheels past
# Python 3.11). See jarvis/audio/wake.py.
wake = ["onnxruntime>=1.17"]
# The double-clickable app's tray icon (Open Jarvis / Restart voice / Quit).
# Optional: without it the app runs with no icon and the HUD's own Quit ends it.
# Pillow also draws that icon, so the frozen build carries no image file.
app = ["pystray>=0.19.5", "pillow>=10"]
# Building Jarvis.exe (packaging/jarvis.spec). Never needed to RUN anything.
build = ["pyinstaller>=6.10"]
# pyyaml: tests/test_packaging.py parses the Windows workflow, because a
# workflow that does not parse fails on GitHub and nowhere a test would see it.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pyyaml>=6"]

# A double-clickable launcher with no console: `.venv\Scripts\Jarvis.exe` on
# Windows. The same function is the frozen exe's entry (packaging/jarvis_app.py),
# so the pip install and the built app start the same way.
[project.gui-scripts]
Jarvis = "jarvis.app.entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:jarvis.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/ is prose. ruff format rewrites python blocks inside markdown, which
# expands the design doc's deliberately compact snippets and buries the diff of
# an actual design change in reformatting noise.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
