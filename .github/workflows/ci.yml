name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check_gitignore.py shells out to `git check-ignore`, which needs the
          # real repo, not a flattened export.
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11

      # The cc extra is needed to RUN the tests, never to reach the network: the
      # Claude Code driver's tests fake the client and construct the SDK's own
      # message dataclasses, which is the only way the recorded payload shapes
      # can be checked on every commit without a credential. The spine still
      # imports on a bare interpreter; the step at the bottom proves it.
      - name: Install
        run: uv venv && uv pip install -e '.[cc,dev]'

      # Runs first and on its own: if a secret pattern has gone inert, that is
      # the most urgent thing in the log, not something to find under a lint dump.
      - name: Secret patterns actually fire
        run: uv run python tools/check_gitignore.py

      - name: No CC BY-NC reference code in the tree
        run: uv run python tools/check_no_reference_code.py

      # The seams in CLAUDE.md are claims about DIRECTION, and a backwards import
      # breaks nothing at runtime: it just makes the phone stage a rewrite instead
      # of a re-wiring, silently, one convenience at a time.
      - name: Layers only depend inwards
        run: uv run python tools/check_layers.py

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      # The spine must import on a bare interpreter. Every process opens the
      # database, including ones that will never install the voice or CC deps.
      - name: Spine imports with no third-party packages
        run: uv run python -S -c "import jarvis.answers, jarvis.db, jarvis.ids, jarvis.clock; print('ok')"
